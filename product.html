<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chi tiết sản phẩm - MineShopee</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⛏️</text></svg>">
  <link rel="stylesheet" href="assets/css/style.css">
  <style>
    .pd-tabs { display: flex; border-bottom: 1px solid #f0f0f0; background: #fcfcfc; }
    .pd-tabs button {
      border: 0; background: none; padding: 14px 20px; font-size: 13.5px;
      font-weight: 600; color: #666; border-bottom: 2px solid transparent;
    }
    .pd-tabs button.active { color: var(--primary); border-bottom-color: var(--primary); background: #fff; }
    .pd-tab-pane { padding: 18px; }
    .fav-action.active { color: #ef4444; border-color: #ffc9c9; background: #fff5f5; }
    .pd-loading { background: #fff; border-radius: var(--radius); padding: 70px 20px; text-align: center; color: var(--muted); }
  </style>
</head>
<body data-page="product">
  <noscript>
    <div style="background:#dc2626;color:#fff;padding:14px 18px;font-family:system-ui,sans-serif;text-align:center;font-size:14px">
      <strong>⚠ JavaScript đang TẮT — website không thể hiển thị.</strong><br>
      Hãy bật JavaScript và thử lại. Nếu bạn dùng Tor Browser: vào menu ⚙ → Security → chọn <em>Standard</em> (không dùng <em>Safest</em>), hoặc mở bằng Chrome/Edge.<br>
      JavaScript is OFF. MineShopee requires JavaScript. In Tor Browser set Security Level to &quot;Standard&quot;, or use Chrome/Edge.
    </div>
  </noscript>

      </div>
    </div>
  </main>

  <footer id="site-footer" class="site-footer"></footer>
  <div class="toast-wrap" id="toast-wrap"></div>

  <script src="assets/js/guard.js"></script>
  <script src="assets/js/data.js"></script>
